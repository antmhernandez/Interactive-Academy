name: Validate interactive academy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check lab/motion.js
          node --check lab/regression.mjs
      - name: Validate lesson data, navigation and printables
        run: |
          node scripts/validate.mjs
          node scripts/test-regression.mjs
          node scripts/validate-curriculum.mjs
          node scripts/test-interactives.mjs
