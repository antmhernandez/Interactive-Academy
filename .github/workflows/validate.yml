name: Validate interactive academy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check applets/contact-forces.js
          node --check scripts/test-contact-forces.mjs
          node --check lab/motion.js
          node --check lab/regression.mjs
          node --check scripts/test-browser.mjs
      - name: Validate lesson data, navigation and printables
        run: |
          node scripts/validate.mjs
          node scripts/test-regression.mjs
          node scripts/validate-curriculum.mjs
          node scripts/validate-learning-resources.mjs
          node scripts/test-interactives.mjs
          node scripts/test-contact-forces.mjs
          node scripts/validate-book-portal.mjs
      - name: Install headless browser for responsive and keyboard tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise publisher journey in Chromium
        run: node scripts/test-browser.mjs
